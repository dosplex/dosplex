  - id: ALIENBREED-SDCARD-MAIN-001
    game: alien_breed
    title: Runs from the SD card
    introduced: 2026-10-24
    setup: {device: steam_machine, backend: x11_nested, tier: T1, tv_mode: 2160p60, layout: side_by_side, side: main,
            preset: "16:9", presentation: fit, window_mode: default, steam_input: default,
            steam_game_resolution: default, controller: any}
    profile: null
    level_required: human
    pass_criteria:
      automated:
        - {kind: process_alive, min_seconds: 40}
        - {kind: window_size, expect: client_requested}
        - {kind: pids_unchanged, side: other, what: steam_pid}
      human:
        - "The game is installed in Main's Steam library on the SD card, and Steam's Storage page lists that drive as a library. For a first run the game is freshly installed onto the card from Main's side, and no prefix or game file is deleted to make Steam run the setup again."
        - "On a first run, Steam runs the game's first-run setup (the Unreal Engine 3 redistributables) without an error. On a rerun that setup has run already and is not expected again. Either way the game starts from Steam on this side and reaches its main menu."
        - "On every run, Steam's logs for the launch hold no `Failed to write app state file` line and no `BFilesystemAllowsExecution: failed to write` line for the card, and the modification time of the game's `appmanifest` file on the card is later than the start of the launch."
        - "The picture is complete, with no clipping or flicker."
        - "Menus and gameplay respond to the controls the game supports."
    known_issue: "With the game on the SD card, Steam could not write to the card in Main's side, so it skipped the game's first-run setup and the game closed after a few seconds. The fix, which keeps Main's own SD card writable in its side, is still being verified."
    source: "2026-10-24, Steam Machine, preview26: Main's Steam library on the SD card was read-only in Main's side. Steam logged failed writes to its test file and to the game's app state file every 6 s and skipped the first-run install script, and the game exited after 4 s. On stock SteamOS the same launch ran the script and the game works. After that the game also ran from the read-only card, so on a rerun the setup alone does not show the card. The schema has no storage field and no kind for a log: the card is in the first human criterion, the log lines in the third."

