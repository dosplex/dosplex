# Dosplex compatibility scenarios: the source of truth for what "compatible" means (ADR-008, ADR-009).
#
# This file defines scenarios. It never says that one passed. A scenario is pending until the project
# owner locks it in accepted.lock, and a pass exists only as a result record on a named candidate. Result
# records carry the ADR-009 metadata and the device baseline; they stay private, and so do raw logs and
# controller identifiers. docs/compatibility.md is generated from this file, the lock and the reviewed
# results. tests/compatibility-schema-test.py validates everything here.
#
# Workflow
#   1. A game fails, or a setup needs coverage: add a scenario below before fixing anything. Its id is
#      GAME-TOPIC-NNN and starts with the game's code. Prefer a general fix over a per-game profile.
#   2. Run the scenario on a candidate and record the observation as a result, whether it passes or fails.
#      Failures stay on record next to the reruns that passed.
#   3. When the owner agrees that the scenario passed at its evidence level, one line goes into
#      accepted.lock: id, hash of the definition, date, level. From then on the scenario is frozen and
#      every later candidate has to pass it again (the cumulative rule).
#   4. The release gate fails a candidate unless every locked scenario has a pass on it, or an ADR-backed
#      waiver (the waivers list at the end of this file).
#
# What the lock freezes: the game, the setup, the profile and the pass criteria. Titles, notes, dates and
# known issues describe a scenario and may change. To tighten a locked scenario, add a new one; the old
# one keeps being checked, and it cannot be removed.
#
# Tiers (ADR-002): T1 is a TV or monitor driven by a Steam Machine or a docked Steam Deck, at 1080p or 4K.
# T2 is the Steam Deck's built-in screen. A T2 result never satisfies a T1 scenario, or the reverse.
#
# Evidence levels (ADR-009), weakest first. A result satisfies a scenario at the scenario's level or above.
#   synthetic  virtual devices on real hardware (did the device path work?)
#   visual     frames captured after the action, with automated assertions (did it render?)
#   human      a person plays it with real controllers and audio (is it good to play?)
# A scenario at the human level lists human criteria, and the other levels list automated ones.
#
# Format notes
#   - YAML reads an unquoted 1:1, 4:3 or 16:9 as a number. Quote the presets.
#   - device and controller may be "any" in a scenario; a result always names what was used.
#   - pass_criteria.automated entries are {kind: ..., <parameters>}; the kinds and their parameters are
#     defined in schema.criteria_kinds. pass_criteria.human entries are short sentences.
#   - profile is null, or {id, version, settings, reason}: a per-game setting that is part of the tested
#     setup (ADR-008). Profiles are a last resort and have to be journaled and reversible.
#   - A game may name window_class, the X11 class (one string, or a list) of its own window. A Proton game's window has
#     the class steam_app_<id>, which needs no entry. A native build has a class of its own, for example
#     crimsonland, and an entry lets a measurement find its window.
#   - The configuration invariants that games rely on are in game-compatibility.yaml.
#
# Migrated on 2026-10-08 from the games list of the previous matrix. Every migrated scenario is pending:
# the old free-text outcomes became notes and sources, and none was turned into a pass.

version: 1

acceptance_policy:
  rule: new_compatibility_fixes_must_preserve_all_previously_accepted_scenarios
  # The first mandatory pair: Valheim's native window and Alien Breed's fixed window.
  first_window_sizing_pair: [VALHEIM-NATIVE-FILL-001, ALIENBREED-SPLIT-MAIN-169-001]
  requirements:
    - "Add each newly failing game scenario as a permanent regression case before fixing it."
    - "Prefer a general runtime solution, validated on the new case and all existing accepted game scenarios on the same candidate."
    - "General compatibility is the architectural goal; explicit per-game profiles are allowed when general behavior is insufficient. Record and test the profile with the accepted scenario."
    - "Keep earlier acceptance cases and their pass criteria; do not silently weaken or remove them."
    - "Unavailable games or hardware leave acceptance pending; source checks and synthetic fixtures do not substitute for real-game evidence."
    - "Record exact game/runtime versions and modes; passing one scenario does not accept every mode or every game."
    - "Record every result with its layout. Side by side (portrait half) is the default; top/bottom (landscape half) is supported and is measured at Native too. If top/bottom proves measurably more compatible, say so on the compatibility page and in the user guide, not in the overlay (ADR-013)."
    - "A scenario is pending until it is listed in accepted.lock. Only the project owner adds a lock entry, after reviewing the recorded evidence."
    - "A locked scenario is frozen: the lock stores a hash of its game, setup, profile and pass criteria, and any change fails the schema test. To tighten a scenario, add a new one; the old one keeps being checked."
    - "A result satisfies a scenario only on the exact candidate, in the scenario's tier, on its device and in its setup, at its evidence level or a higher one. A T2 result never satisfies a T1 scenario and the reverse (ADR-002)."
    - "A failure stays on record. A later pass on the same candidate counts only if it names the failure under reruns, with a reason."
    - "The gate excuses a locked scenario only for an ADR-backed waiver."

schema:
  # Values for the setup of a scenario and of a result: {value: label}. The labels are the public wording.
  vocabulary:
    device:
      steam_machine: Steam Machine
      steam_deck: Steam Deck
      any: Any device of the tier
    backend:
      x11_nested: Nested in the host session
      drm: Direct display (development only)
    tv_mode:
      1080p60: 1080p display
      2160p60: 4K display
      panel: Steam Deck built-in screen
    layout:
      single: Full screen
      side_by_side: Side by side
      top_bottom: Top / bottom
    side:
      main: Main
      guest: Guest
    preset:
      native: Native
      "1:1": "1:1"
      "4:3": "4:3"
      "16:9": "16:9"
    presentation:
      fit: Keep proportions
      stretch: Stretch to fill
    window_mode:
      default: The game's own setting
      fullscreen: Fullscreen
      borderless: Borderless window
      windowed: Window
    steam_input:
      default: Steam's default for the game
      enabled: Enabled
      disabled: Disabled
    steam_game_resolution:
      default: Default
      custom: Custom
    controller:
      any: Any supported controller
      none: No controller
      virtual: Virtual test controller
      deck_builtin: Steam Deck built-in controls
      steam_controller: Steam Controller
      dualsense: DualSense
      dualshock4: DualShock 4
      xbox_pad: Xbox-compatible pad

  # Automated criteria: kind -> parameters (all required). A parameter is int, number, str or a list of
  # allowed values. New kinds are added here, in a reviewed change.
  criteria_kinds:
    # The game's processes are still running this long after launch.
    process_alive: {min_seconds: int}
    # The game window is as large as the side's region, or keeps the size the game asked for.
    window_size: {expect: [region, client_requested]}
    # The window geometry does not change across the samples.
    geometry_stable: {samples: int, interval_s: number}
    # On a frame captured after the action, the content box fills the region (Native, Stretch) or the
    # centred box that Fit computes, to within the tolerance, and covers that much of it in each axis.
    content_bbox: {expect: [fill_region, fitted_box], coverage_min_pct: number, tolerance_px: int}
    # The game's own mode list offers the side's native mode.
    mode_listed: {mode: [native]}
    # The processes of this side or of the other side keep their ids across the scenario's actions.
    pids_unchanged: {side: [same, other], what: [steam_pid, game_pid]}
    # Input from a virtual or a physical device reaches the game's menu or gameplay.
    input_delivered: {source: [virtual, physical], target: [menu, gameplay]}

