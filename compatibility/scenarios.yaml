      - "2026-10-07: user confirms working at native side resolution, correcting the initial 1080p description. Main launch log identifies app 2310 rerelease/quake_x64_steam.exe through Proton 11.0; installed build 25148042, retained compositor daf29de8. Native refers to resolution, not a native Linux runtime. Full mode/input/audio matrix remains open."
      - "Later 2026-10-07: automated relaunch crashes during SDL display setup in ucrtbase, also with the exact original launcher restored. Native/1080p, forced resizing on/off, old layer filter and a narrow WSI exclusion did not resolve it. Fixing the audio startup socket removed the XAudio initialization error but not the crash. This failure is retained as the baseline for the scoped mode-list workaround below."
      - "Latest 2026-10-07: Win32 current mode 1920x2160 was absent from Proton 11.0-2 synthesized mode list (listed 2160x1920 instead). Main app 2310 only: HKCU Software/Wine/X11 Driver EmulateModelist REG_SZ Y exposes actual monitor modes. Two normal Steam launches pass 25s/45s; native exclusive config 1920x2160, borderless 0, windowed 0, dynamic resolution 0 and actual X window 1920x2160 verified. Side swap/return preserves game and both Steam PIDs. Workaround has scoped owned-value recovery; general deployment and renewed physical input/gameplay checks remain open."
      - "Final 2026-10-07 candidate 0dc25682: ordinary native exclusive relaunch survives 25s and demo renders; both games feed Full mix and Gentle/Balanced/Strong alongside Guest native Crimsonland. Audio overlay/swaps/leave preserve both Steam PIDs. Physical listening and gameplay input remain separate."
      - "Historical Deck regression; reproduce on the current Steam machine before treating it as current evidence."
      - "Future Deck coverage: distinguish onboard controls from the external routed gamepad."
      - "2026-05-09: Steam launched app 2310 through Proton 10.0 at 09:47:04 and removed all tracked game processes by 09:47:11."
      - "2026-05-09: Dosplex compositor stayed alive; Steam console log only showed nested WSI env warnings and MangoHud 32-bit dependency warnings, so capture a Proton log next."
      - "2026-05-09: Proton log from direct run crashed during SDL/video display setup after XWayland reported a 1280x720 Generic Non-PnP Monitor while Dosplex state was 1280x800."
      - "2026-05-09: Deployed explicit gamescope --output-width/--output-height/--nested-width/--nested-height from DOSPLEX_OUTPUT_WIDTH/HEIGHT; XWayland now reports 1280x800 in single-screen mode."
      - "Next run: Repeat native exclusive gameplay/input and other native regions; compare Win32 selectable modes with current monitor before applying any workaround."
      - "Next run: Capture the Steam console and Proton logs for app 2310 if it still closes."

