#
# Contributor License Agreement check (CLA.md), with CLA Assistant Lite.
# On every pull request it checks that each commit author has signed. An author signs by posting the sentence
# below as a comment in the pull request; "recheck" runs the check again. Signatures are stored in
# signatures/version1/cla.json on the branch cla-signatures, which must exist and must not be protected.
# The action never checks out or runs code from the pull request.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          github.event_name == 'pull_request_target' ||
          (github.event.issue.pull_request &&
           (github.event.comment.body == 'recheck' ||
            github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
        # contributor-assistant/github-action v2.6.1, pinned to its commit
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/dosplex/dosplex/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: royakem,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
          custom-notsigned-prcomment: >-
            Thank you for your contribution. Before it can be merged, please read the
            [Dosplex Contributor License Agreement](https://github.com/dosplex/dosplex/blob/main/CLA.md).
            You keep your copyright. To sign, post the comment below in this pull request.
          custom-allsigned-prcomment: All contributors have signed the Dosplex Contributor License Agreement.
